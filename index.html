<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#04050a" />
    <meta
      name="description"
      content="A first-person horror game. The city is dark. Shut down the six nodes keeping the AI alive before it finds you."
    />
    <title>Blackout</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="stage" aria-label="City view"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div id="hud" class="hud" hidden>
      <div id="nodes" class="nodes" aria-label="Nodes online"></div>
      <div id="toast" class="toast" aria-live="polite"></div>
      <div id="timer" class="timer">00:00</div>
      <div class="crosshair" aria-hidden="true"></div>
      <div id="prompt" class="prompt" hidden>Hold <kbd>E</kbd> to shut down</div>
      <div id="progress" class="progress" hidden><i></i></div>
      <div id="stamina" class="stamina"><i></i></div>
      <div class="hint">
        <kbd>F</kbd> light <kbd>Shift</kbd> run <kbd>Esc</kbd> pause
      </div>
    </div>

    <div id="overlay" class="overlay">
      <div id="card" class="card">
        <span id="eyebrow" class="eyebrow">Grid status: dark</span>
        <h1 id="title">BLACKOUT</h1>
        <p id="body"></p>
        <div id="key-guide" class="keys">
          <kbd>W A S D</kbd><span>Move</span>
          <kbd>Shift</kbd><span>Run. Watch the bar.</span>
          <kbd>E</kbd><span>Hold to shut a node down</span>
          <kbd>F</kbd><span>Flashlight</span>
          <kbd>Mouse</kbd><span>Look</span>
          <kbd>Esc</kbd><span>Pause</span>
        </div>
        <p id="note" class="note" hidden></p>
        <div class="actions">
          <button id="primary" class="primary">Begin</button>
          <button id="secondary" class="text-button" hidden>Restart</button>
        </div>
        <footer>
          <span id="best"></span>
          <button id="sound" class="text-button" aria-pressed="true">Sound on</button>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
